[package]
name = "central-heating-esp32"
version = "0.1.0"
authors = ["mj"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "central-heating-esp32"
harness = false # Required for ESP-IDF

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Espressif crates
esp-idf-svc = { version = "0.49", default-features = false, features = ["std", "binstart", "alloc"] }
esp-idf-hal = "0.44"
esp-idf-sys = { version = "0.35", default-features = false }

[build-dependencies]
embuild = "0.32"
