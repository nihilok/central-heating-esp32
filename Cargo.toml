[package]
name = "central-heating-esp32"
version = "0.1.0"
authors = ["mj"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "central-heating-esp32"
harness = false # Required for ESP-IDF

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[profile.dev.package."*"]
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Espressif crates: depend on esp-idf-svc only and use its re-exports
# (esp_idf_svc::hal, esp_idf_svc::sys) to avoid version drift.
esp-idf-svc = "0.53"

[build-dependencies]
embuild = "0.33"
